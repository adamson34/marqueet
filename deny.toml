# cargo-deny: run `cargo deny check` locally; CI runs it on every push.
# Checks RustSec advisories, licenses, banned crates and dependency sources.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Mozilla's root-certificate bundle (webpki-root-certs), used by rustls to
    # verify HTTPS. A permissive data license.
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Decisions that shouldn't quietly regress: TLS is rustls on ring (no C
# toolchain, builds anywhere; ADR-0002, ADR-0009), and the unmaintained
# ttf-parser stays out (RUSTSEC-2026-0192).
deny = [
    { crate = "aws-lc-rs", reason = "rustls uses ring (ADR-0009)" },
    { crate = "aws-lc-sys", reason = "rustls uses ring (ADR-0009)" },
    { crate = "openssl", reason = "rustls only (ADR-0009)" },
    { crate = "openssl-sys", reason = "rustls only (ADR-0009)" },
    { crate = "native-tls", reason = "rustls only (ADR-0009)" },
    { crate = "ttf-parser", reason = "unmaintained (RUSTSEC-2026-0192)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
