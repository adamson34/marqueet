name: Snap

# Builds the snap for both architectures and uploads them as artifacts.
# edge.yml calls this after each merge to dev (version from git, grade devel);
# release.yml calls it for a release tag (that version, grade stable).
on:
  workflow_call:
    inputs:
      version:
        description: Release version (e.g. 1.0.0); empty for an edge build
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
    paths: ["snap/**", ".github/workflows/snap.yml"]

permissions:
  contents: read

jobs:
  snap:
    name: snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Release version and grade
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' || { echo "bad version $VERSION"; exit 1; }
          sed -i "s/^version: git\$/version: '$VERSION'/; s/^grade: devel\$/grade: stable/" snap/snapcraft.yaml
          grep -E '^(version|grade):' snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: marqueet-snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          retention-days: 14
