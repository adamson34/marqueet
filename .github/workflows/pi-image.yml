name: Pi image

# Builds the flashable Raspberry Pi image (Ubuntu Server 24.04 + Marqueet's
# first-boot setup). edge.yml calls this and publishes the image with the
# snaps.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths: ["packaging/pi-image/**", "install.sh", ".github/workflows/pi-image.yml"]

permissions:
  contents: read

jobs:
  image:
    name: Raspberry Pi image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the scripts and cloud-init config
        run: |
          shellcheck install.sh packaging/pi-image/build.sh
          for f in packaging/pi-image/*.service packaging/pi-image/*.timer packaging/pi-image/*.path; do
            systemd-analyze verify --man=no "$f" 2>&1 | grep -v "Command /bin/sh.*is not executable\|Failed to prepare" || true
          done
      - name: Build
        run: packaging/pi-image/build.sh dist
      - name: The image has Marqueet's setup
        run: |
          xz -dc dist/marqueet-pi.img.xz > "$RUNNER_TEMP/check.img"
          loop=$(sudo losetup -Pf --show "$RUNNER_TEMP/check.img")
          b="$RUNNER_TEMP/boot"; r="$RUNNER_TEMP/root"
          mkdir -p "$b" "$r"
          sudo mount -o ro "${loop}p1" "$b"
          sudo mount -o ro "${loop}p2" "$r"
          test -f "$b/marqueet/install.sh"
          test -f "$b/MARQUEET-README.txt"
          grep -q "#cloud-config" "$b/user-data"   # Ubuntu's own, left for Imager
          u="$r/etc/systemd/system"
          test -L "$u/multi-user.target.wants/marqueet-firstboot.service"
          test -L "$u/multi-user.target.wants/marqueet-reset.path"
          test -L "$u/timers.target.wants/marqueet-update.timer"
          test -f "$u/marqueet-firstboot.service"
          test "$(readlink "$u/ssh.service")" = /dev/null
          test "$(readlink "$u/ssh.socket")" = /dev/null
          sudo umount "$b" "$r"
          sudo losetup -d "$loop"
          rm "$RUNNER_TEMP/check.img"
      - uses: actions/upload-artifact@v4
        with:
          name: marqueet-pi-image
          path: dist/marqueet-pi.img.xz
          retention-days: 7
          compression-level: 0
