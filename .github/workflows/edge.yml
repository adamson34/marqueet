name: Edge release

# After each merge to dev: build the snaps and publish them as the rolling
# "edge" pre-release, with stable file names (for the installer and the Pi
# image) and SHA256 checksums. main isn't touched (ADR-0010).
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: edge-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Devices install edge builds, so nothing is published unless the full
  # checks pass on this exact commit.
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    uses: ./.github/workflows/snap.yml

  image:
    needs: checks
    uses: ./.github/workflows/pi-image.yml

  # The Snap Store's edge channel: store-signed revisions that snapd verifies,
  # refreshes automatically and can revert (ADR-0014). Separate from the
  # GitHub release, so a store review in progress never blocks it.
  store:
    needs: [checks, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marqueet-snap-*
          path: dist
          merge-multiple: true
      - name: Upload to the Snap Store (edge)
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          sudo snap install snapcraft --classic
          for snap in dist/*.snap; do
            snapcraft upload --release=edge "$snap"
          done

  publish:
    needs: [checks, build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marqueet-*
          path: dist
          merge-multiple: true
      - name: Stable names and checksums
        run: |
          cd dist
          for arch in amd64 arm64; do
            mv marqueet_*_"$arch".snap "marqueet_$arch.snap"
          done
          sha256sum marqueet_*.snap marqueet-pi.img.xz > SHA256SUMS
          cat SHA256SUMS
      - name: Replace the edge pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete edge --yes --cleanup-tag || true
          gh release create edge dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Edge: latest dev build" \
            --notes "Built automatically from dev at ${GITHUB_SHA::7}. For testing; not a release. Install with the one-line installer in the README."
