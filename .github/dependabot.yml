version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      # Its ref is the Rust version installed; ci.yml pins 1.88 to check the
      # MSRV, which only changes with rust-version in Cargo.toml.
      - dependency-name: dtolnay/rust-toolchain
